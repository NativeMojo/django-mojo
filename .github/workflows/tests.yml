# Test-tier CI (maestro #2793). See docs/django_developer/testit/Tiers.md.
#
#   push          -> the core preset (~9s): non-advisory status on every push.
#   pull_request  -> the framework preset (~45s): ADVISORY (advisory: true)
#                    until #2813 removes the shared-state flakes. Setting
#                    `advisory: false` makes failures fail the check; requiring
#                    that check still belongs in repository branch protection.
name: tests

on:
  push:
  pull_request:

jobs:
  core:
    if: github.event_name == 'push'
    uses: ./.github/workflows/testit.yml
    with:
      tier: core

  framework:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/testit.yml
    # Advisory until #2813: the framework preset still carries the shared-state
    # flake class (throttle/rate-limit/token/rendition), which would make PRs
    # intermittently, wrongly red. Flip to blocking by setting advisory: false.
    with:
      tier: framework
      advisory: true
