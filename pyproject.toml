[project]
name = "django-mojo"
version = "1.4.0"
description = "A REST framework for Django with secure DB-backed settings, REST/WebSocket support, jobs, auth, and more."
authors = [{ name = "MOJO Dev Team", email = "gotmojo@mojo.com" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<4.0"
dependencies = [
    "django>=5.2.14,<6.0.0",
    "requests>=2.33.0,<3.0.0",
    "faker>=35.2.0,<36.0.0",
    "ujson>=5.13.0,<6.0.0",
    "pyjwt>=2.13.0,<3.0.0",
    "pycryptodome>=3.21.0,<4.0.0",
    "pyobjict>=2.1.3,<4.0.0",
    "redis>=7.0.0,<8.0.0",
    "pytz>=2025.1,<2026.0",
    "ua-parser>=1.0.1,<2.0.0",
    "gevent>=25.5.1,<26.0.0",
    "mistune>=3.2.1,<4.0.0",
    "pygments>=2.20.0,<3.0.0",
    "python-magic>=0.4.27,<0.5.0",
    "twilio>=9.8.4,<10.0.0",
    "phonenumberslite>=9.0.17,<10.0.0",
    "qrcode[pil]>=7.4.2,<8.0.0",
    "Pillow>=12.2.0,<13.0.0",
    "cryptography>=50.0.0,<51.0.0",
    # Security-floor pins for runtime-transitive deps (pulled via requests /
    # boto3 / pyfcm / twilio / httpx) so `pip install django-mojo --upgrade`
    # forces the patched versions onto downstream deployments. See CHANGELOG.
    "urllib3>=2.7.0,<3.0.0",
    "aiohttp>=3.14.3,<4.0.0",
    "idna>=3.15,<4.0.0",
    "dnspython>=2.8.0,<3.0.0",
    "python-whois>=0.9.6,<0.10.0",
    "pyotp>=2.9.0,<3.0.0",
    "bcrypt>=5.0.0,<6.0.0",
    "fido2>=2.2.1",
    "boto3>=1.42.73",
    "pyfcm>=2.1.0",
    "websocket-client>=1.9.0",
    "uvicorn[standard]>=0.42.0",
    "anthropic>=0.87.0",
    "bs4>=0.0.2",
    "rich>=13.0.0"
]

[project.optional-dependencies]
# Docit knowledge base (mojo.apps.docit_kb) — vector search over docit pages.
# Requires the pgvector Postgres extension in the target database.
kb = [
    "pgvector>=0.4.0",
]
# SVG rasterization for fileman renditions (mojo.apps.fileman.renderer.vector).
# Optional on purpose: resvg-py is a single-maintainer wrapper around the resvg
# Rust crate, and most deployments never upload an SVG. Without it, SVG files
# simply get no renditions — exactly the pre-1.2.59 behavior. Self-contained
# wheels (manylinux/musllinux/macOS/Windows), so no system libraries are needed.
# See docs/django_developer/fileman/renditions.md.
svg = [
    "resvg-py>=0.3.3,<0.4.0",
]

[dependency-groups]
dev = [
    "psycopg2-binary>=2.9.11",
    "pgvector>=0.4.0",
    # Present in dev so the SVG rendition tests actually execute.
    "resvg-py>=0.3.3,<0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["mojo", "testit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
