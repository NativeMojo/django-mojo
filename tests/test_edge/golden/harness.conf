# staging harness — nginx -t pre-filter only, never loaded to serve
#
# Every path used by this staged graph points INSIDE the generation because this check runs
# UNPRIVILEGED (see services/installer.py: a sudo'd `nginx -t -c` over an
# app-writable file is a root escalation via load_module). An app user
# cannot write nginx's packaged prefix, so leaving these at their
# defaults would fail the check for permissions rather than for config.
# The staging/ trees are listen-remapped copies of http.d/ and conf.d/:
# nginx -t binds every listen it parses, and 443/80 need root.
pid /opt/api/var/edge/generations/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa/nginx.pid;
error_log /opt/api/var/edge/generations/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa/error.log;
events { worker_connections 64; }
http {
    default_type application/octet-stream;
    types_hash_max_size 4096;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    include /opt/api/var/edge/generations/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa/staging/http.d/*.conf;
    include /opt/api/var/edge/generations/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa/staging/conf.d/*.conf;
}
