# staging harness — nginx -t pre-filter only, never loaded to serve
#
# Every path below points INSIDE the generation because this check runs
# UNPRIVILEGED (see services/installer.py: a sudo'd `nginx -t -c` over an
# app-writable file is a root escalation via load_module). An app user
# cannot write nginx's packaged prefix, so leaving these at their
# defaults would fail the check for permissions rather than for config.
pid /opt/api/var/edge/generations/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa/nginx.pid;
error_log /opt/api/var/edge/generations/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa/error.log;
events { worker_connections 64; }
http {
    default_type application/octet-stream;
    types_hash_max_size 4096;
    client_body_temp_path /opt/api/var/edge/generations/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa/tmp/client_body;
    proxy_temp_path /opt/api/var/edge/generations/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa/tmp/proxy;
    fastcgi_temp_path /opt/api/var/edge/generations/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa/tmp/fastcgi;
    uwsgi_temp_path /opt/api/var/edge/generations/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa/tmp/uwsgi;
    scgi_temp_path /opt/api/var/edge/generations/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa/tmp/scgi;
    include /opt/api/var/edge/generations/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa/http.d/*.conf;
    include /opt/api/var/edge/generations/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa/conf.d/*.conf;
}
