# edge http base — rendered per generation, never hand-edited
include /etc/nginx/mime.types;

log_format main '$remote_addr - - [$time_local] '
                '"$request_method $scheme://$host$request_uri $server_protocol" '
                '$status $body_bytes_sent "$http_referer" '
                '"$http_user_agent" $request_time $server_port';

map $http_user_agent $loggable {
    ~*ELB-HealthChecker 0;
    default 1;
}

access_log /opt/api/var/edge/log/access.log main if=$loggable;

sendfile on;
keepalive_timeout 65;
server_tokens off;
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_proxied any;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

geo $edge_block_ip {
    default 0;
    192.0.2.1/32 0;
    203.0.113.0/24 86;
}

geo $edge_watch_ip {
    default 0;
    192.0.2.1/32 0;
    198.51.100.7/32 87;
}

map $http_user_agent $edge_block_ua {
    default 0;
    "~*^Lynx" 0;
    "~*badbot" 82;
}

map $http_user_agent $edge_watch_ua {
    default 0;
    "~*^Lynx" 0;
    "~*watchbot" 83;
}

map "$edge_watch_ip:$edge_watch_ua" $edge_watch {
    default 1;
    "0:0" 0;
}

log_format edge_watch '$remote_addr - [$time_local] '
                      '"$request_method $scheme://$host$request_uri" '
                      '$status ip=$edge_watch_ip ua=$edge_watch_ua '
                      '"$http_user_agent"';

access_log /opt/api/var/edge/log/edge_watch.log edge_watch if=$edge_watch;
