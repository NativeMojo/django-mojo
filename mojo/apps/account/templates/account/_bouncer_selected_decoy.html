<div id="mbg-decoy-form" role="form" aria-label="Sign in">
  <h1>Sign In</h1>
  <p id="mbg-decoy-message" role="status" aria-live="polite"></p>
  <fieldset id="mbg-decoy-fields" disabled>
    <label class="mbg-field" for="mbg-username">Username or Email
      <input id="mbg-username" type="text" autocomplete="off">
    </label>
    <label class="mbg-field" for="mbg-password">Password
      <input id="mbg-password" type="password" autocomplete="off">
    </label>
    <button id="mbg-signin" type="button">Sign In</button>
  </fieldset>
  <noscript><p>Enable JavaScript to continue, or contact the site operator for help.</p></noscript>
</div>
